-dontwarn **

-obfuscationdictionary dictionary.txt
-classobfuscationdictionary dictionary.txt
-packageobfuscationdictionary dictionary.txt

# Preserve all annotations globally — required by Mixin, Gson, and Fabric
-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod

# Keep Fabric entrypoints (referenced by fabric.mod.json)
-keep public class com.trident.core.Trident { *; }
-keep public class com.trident.core.TridentLoader { *; }
-keep public class com.trident.network.DiscordIntegration { *; }

# Keep Mixin classes (injected by Fabric at runtime via reflection)
-keep @org.spongepowered.asm.mixin.Mixin class * { *; }
-keep class com.trident.mixin.** { *; }

# Keep Gson-serialized config fields
-keep class com.trident.config.MacroConfig { *; }

# Keep ModInitializer interface methods
-keepclassmembers class * implements net.fabricmc.api.ModInitializer {
    public void onInitialize();
}
-keepclassmembers class * implements net.fabricmc.api.ClientModInitializer {
    public void onInitializeClient();
}